name: Build & Deploy to Server

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/secretary-app

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: ./server
            file: ./server/Dockerfile.prod
          - name: client
            context: ./client
            file: ./client/Dockerfile.prod
          - name: ai-service
            context: ./edi3-ai-production
            file: ./edi3-ai-production/Dockerfile
          - name: whatsapp-bridge
            context: ./whatsapp-bridge-go
            file: ./whatsapp-bridge-go/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-platform build
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:latest
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:${{ github.sha }}

  deploy:
    name: Deploy via SSH
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deploy Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            git checkout main
            git pull origin main
            
            # Descargar únicamente las nuevas imágenes compiladas desde GHCR
            docker compose -f docker-compose.prod.yml pull
            
            # Levantar los contenedores de producción sin recompilar
            docker compose -f docker-compose.prod.yml up -d
            
            # Limpiar imágenes huérfanas/antiguas para liberar espacio en la RPi
            docker image prune -af
