name: Development Build & Deploy

on:
  push:
    branches:
      - development
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/secretary-app

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: client
            context: ./client
            file: ./client/Dockerfile
          - name: ai-service
            context: ./edi3-ai-production
            file: ./edi3-ai-production/Dockerfile
          - name: whatsapp-bridge
            context: ./whatsapp-bridge-go
            file: ./whatsapp-bridge-go/Dockerfile

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-platform build
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:dev-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}:dev-latest

  build-server-architectures:
    name: Build server (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          file: ./server/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-server:dev-${{ github.sha }}-${{ matrix.arch }}

  publish-server-manifest:
    name: Publish server multi-architecture tags
    needs: build-server-architectures
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create server multi-architecture tags
        env:
          SERVER_IMAGE: ${{ env.IMAGE_PREFIX }}-server
          IMAGE_TAG: dev-${{ github.sha }}
        run: |
          docker buildx imagetools create \
            --tag "$SERVER_IMAGE:$IMAGE_TAG" \
            --tag "$SERVER_IMAGE:dev-latest" \
            "$SERVER_IMAGE:$IMAGE_TAG-amd64" \
            "$SERVER_IMAGE:$IMAGE_TAG-arm64"

  deploy-dev:
    name: Deploy Development to RPi
    needs: [build-and-push, publish-server-manifest]
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deploy Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            # Actualizar código fuente
            git fetch origin
            git checkout development
            git pull origin development

            # Usar desarrollo y su configuración específica de Raspberry Pi.
            # Validar configuración y conectividad antes de interrumpir el backend activo.
            docker compose -f docker-compose.yml -f docker-compose.rpi.yml config --quiet
            docker inspect secretary-legacy-db >/dev/null
            docker network inspect proxy-network >/dev/null
            docker compose -f docker-compose.yml -f docker-compose.rpi.yml run --rm --no-deps --entrypoint node server -e 'const mariadb = require("mariadb"); (async () => { if (process.env.DB_HOST !== "secretary-legacy-db" || process.env.DB_NAME !== "clinical_management") throw new Error("Unexpected database endpoint"); const conn = await mariadb.createConnection({ host: process.env.DB_HOST, user: process.env.DB_USER, password: process.env.DB_PASSWORD, database: process.env.DB_NAME, port: process.env.DB_PORT || 3306 }); const rows = await conn.query("SELECT DATABASE() AS db, @@hostname AS host"); console.log(`Read-only DB check passed: ${rows[0].db} on ${rows[0].host}`); await conn.end(); })().catch((error) => { console.error(`Read-only DB check failed (${error.code || "unknown"}): ${error.message}`); process.exit(1); });'

            # Detener contenedores actuales
            docker compose -f docker-compose.yml -f docker-compose.rpi.yml down

            # Pull de las nuevas imágenes taggeadas como dev
            docker compose -f docker-compose.yml -f docker-compose.rpi.yml pull

            # Levantar contenedores de desarrollo
            docker compose -f docker-compose.yml -f docker-compose.rpi.yml up -d --no-build

            # Confirmar que el backend responda antes de marcar el despliegue como exitoso.
            attempt=0
            until curl --fail --silent http://127.0.0.1:5000/api/health >/dev/null; do
              attempt=$((attempt + 1))
              if [ "$attempt" -ge 30 ]; then
                docker compose -f docker-compose.yml -f docker-compose.rpi.yml logs --tail=100 server
                echo "❌ El backend v2 no superó el healthcheck HTTP"
                exit 1
              fi
              sleep 2
            done
            echo "✅ Healthcheck HTTP del backend v2 correcto"

            # Limpiar contenedores detenidos y imágenes no usadas
            docker container prune -af
            docker image prune -af

            echo "✅ Deploy de desarrollo completado en la RPi"
