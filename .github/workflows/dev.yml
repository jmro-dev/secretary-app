name: Development Build & Deploy

on:
  push:
    branches:
      - development
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/secretary-app

jobs:
  build-and-push:
    name: Build & Push Images to GHCR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: server
            context: ./server
            file: ./server/Dockerfile
            image: ghcr.io/jmrodev/secretary-app-server
          - name: client
            context: ./client
            file: ./client/Dockerfile
            image: ghcr.io/jmrodev/secretary-app-client
          - name: ai-service
            context: ./edi3-ai-production
            file: ./edi3-ai-production/Dockerfile
            image: ghcr.io/jmrodev/secretary-app-ai-service
          - name: whatsapp-bridge
            context: ./whatsapp-bridge-go
            file: ./whatsapp-bridge-go/Dockerfile
            image: ghcr.io/jmrodev/secretary-app-whatsapp-bridge

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU for multi-platform build
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ matrix.image }}:dev-${{ github.sha }}
            ${{ matrix.image }}:dev-latest

  deploy-dev:
    name: Deploy Development to RPi
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Execute Remote Deploy Commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}

            # Actualizar código fuente
            git fetch origin
            git checkout development
            git pull origin development

            # Usar docker-compose de desarrollo (no production)
            # Detener contenedores actuales
            docker compose -f docker-compose.yml down

            # Pull de las nuevas imágenes taggeadas como dev
            docker compose -f docker-compose.yml pull

            # Levantar contenedores de desarrollo
            docker compose -f docker-compose.yml up -d

            # Limpiar contenedores detenidos y imágenes no usadas
            docker container prune -af
            docker image prune -af

            echo "✅ Deploy de desarrollo completado en la RPi"